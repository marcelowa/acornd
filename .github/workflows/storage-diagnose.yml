name: storage-diagnose

# Temporary maintenance workflow: read-only storage report from the runner.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Filesystems
        run: df -h

      - name: Docker usage
        run: |
          docker system df || echo "docker not reachable"
          echo "=== largest images ==="
          docker images --format '{{.Size}}\t{{.Repository}}:{{.Tag}}' | sort -rh | head -15 || true

      - name: Runner layout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          RUNNER_ROOT="$(cd "$GITHUB_WORKSPACE/../.." && pwd)"
          echo "RUNNER_ROOT=$RUNNER_ROOT"
          echo "=== runner root, 2 levels ==="
          du -h --max-depth=2 "$RUNNER_ROOT" 2>/dev/null | sort -rh | head -25

      - name: Home directory hotspots
        run: |
          HOME_DIR="$(cd "$GITHUB_WORKSPACE" && pwd | cut -d/ -f1-3)"
          echo "=== $HOME_DIR, 2 levels ==="
          du -h --max-depth=2 "$HOME_DIR" 2>/dev/null | sort -rh | head -25

      - name: Top-level directories
        run: |
          echo "=== / one level (same filesystem) ==="
          du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -15

      - name: Toolchain caches
        run: |
          for d in ~/.cache/go-build ~/go/pkg/mod ~/.bun/install/cache ~/.cache/actions; do
            [ -d "$d" ] && du -sh "$d"
          done
          journalctl --disk-usage 2>/dev/null || true

      - name: Old work directories
        run: |
          echo "=== _work contents ==="
          ls -la "$GITHUB_WORKSPACE/.." 2>/dev/null || true
