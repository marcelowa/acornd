# The checks nobody runs by hand: a dependency with a published vulnerability, a secret in the
# tree, and the security rules a staticcheck pass does not carry. No job below is allowed to fail
# quietly: each one either passes or says what it found.
#
# None of it is in `make lint`: every one of these needs a network for its database, and lint has
# to work on a train. The Go half runs locally as `make security`, so a finding can be reproduced
# without waiting for a runner.
#
# On the weekly schedule a red run is a report — it says a dependency has a CVE and blocks
# nothing. On a release tag it is a gate, because adopting a vulnerable dependency is worse than a
# failing pipeline at exactly that moment.
#
# The mutation job is the exception: it is a report on the same schedule, and its red run means a
# test stopped proving something rather than that a dependency moved.
#
# The sast job used to be the other exception, and it was the wrong kind: `continue-on-error` kept
# it green through 115 findings, so the report it made was a report nobody could act on. It is a
# gate now, and what it reports is a finding nobody has read yet.
name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: govulncheck
        # Reachable only: the call graph decides, so a CVE in a dependency this build never calls
        # does not hold a release. It found eleven reachable standard-library vulnerabilities on
        # `go 1.27.1`, all fixed by 1.27.2 and 1.27.3 — which is why the module pins 1.27.3.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd gateway && govulncheck ./...

  sast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
      # Not the shared setup: this job installs the one tool it runs and needs no bun, no worker
      # dependencies, and no interface. Paying for them would be minutes spent to ignore them.
      - name: gosec
        # `make sast`, not a second copy of the command: which rules this repository has decided
        # are architecture rather than defect is named in the Makefile beside the reason each one
        # was read and dropped, so this gate and `make security` cannot disagree about it.
        #
        # A gate, and it was not one before. `continue-on-error` kept this job green while 115
        # findings scrolled past it, which meant the one thing it could have reported — a new one —
        # was the one thing it did not. What survives the exclusions is the class nobody writes by
        # hand: integer conversions, unchecked errors, unsafe. Every remaining finding was fixed or
        # is a `#nosec` that names its rule and its reason, because the target asks for both.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          make sast

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The history, not just the diff: a key that was committed once and deleted is still in
          # every clone, and a secret that is only clean in HEAD is not clean.
          fetch-depth: 0
      # Go, because gitleaks is a Go program: this job used to borrow whatever toolchain the
      # runner happened to have, and a fresh image without one failed with "go: command not found".
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --no-banner --redact --config .gitleaks.toml

  mutations:
    # The mutation floors are the honest half of "a test that fails without the change", and they
    # cost minutes per package — which is exactly why they are here and not on a pull request.
    #
    # A red run files an issue rather than opening a pull request: a workflow can say which line
    # survived, and nothing more. Writing the test that kills it needs judgement, and a fix PR made
    # without it would be a guess with a green tick on it. The issue carries the report, so the fix
    # is a five-minute job with the evidence already in hand.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        package: ["./internal/control", "./internal/sandbox"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          tools: true
      - name: mutations ${{ matrix.package }}
        id: mutants
        run: |
          set +e
          make mutations PKG=${{ matrix.package }} > "$RUNNER_TEMP/mutants.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mutants.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # The report a person needs, written where the issue step can read it.
          {
            echo "make mutations PKG=${{ matrix.package }} failed on \`${{ github.sha }}\`."
            echo
            echo '```'
            grep -E 'LIVED|Killed:|Test efficacy' "$RUNNER_TEMP/mutants.log" | sed 's/^ *//' | head -40
            echo '```'
            echo
            echo "A surviving mutant is a test that ran and did not distinguish, and the floor in"
            echo "\`.mutationfloors\` may only move up — so the fix is a test, not a number."
          } > "$RUNNER_TEMP/body.md"
          [ "$status" -eq 0 ] || exit 1
      - name: File what survived
        # `failure()` and the outcome: a step's own `if` is read as `success() && …`, so the
        # outcome alone skips this in exactly the case it exists for — and the outcome alone also
        # keeps a broken install from being filed as "a test is missing".
        if: failure() && steps.mutants.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: |
          gh label create mutation --description "A mutant lived: a test that ran and did not distinguish" --color "fbca04" 2>/dev/null || true
          title="Mutation survivors in ${PACKAGE#./}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" --label mutation
          fi
