# The rules are only real if something checks them on every change.
#
# `make lint` is static analysis and `make test` adds the unit tests, the worker protocol
# against a real worker process, -race, and the end-to-end suite against a real gateway.
# `make test-sandbox` boots real microVMs, which need /dev/kvm.
#
# Everything runs on GitHub's runners: this is a public repository, so they cost nothing, and
# each job gets its own machine instead of queueing behind the others on one. The only thing
# self-hosted bought was the hypervisor, and it does not buy it any more — the box that has one
# runs one job at a time, so `security`, `modernize` and `release` moved off it too and nothing
# in this repository asks for it. Side benefit: a fresh machine every run, so the kind of
# poisoned state directory that took the sandbox tier down on 2026-10-26 cannot survive a job.
#
# That includes the microVM tier: GitHub's hosted runners expose /dev/kvm once the udev rule
# below makes it readable by the runner user, which was measured rather than assumed on 24.04 —
# the whole tier passed there in 65 seconds, on the same machine as the three fast jobs. Every
# job is on 26.04 now: it is the current GA image and the one GitHub moves `ubuntu-latest` to in
# November 2026, so waiting would only mean meeting it on someone else's schedule. The microVM
# tier fails rather than skips when /dev/kvm is missing, so if a newer image does not carry it,
# the pipeline says so in the first run instead of going quiet. The dispatch input stays, for
# sending it to a runner with another hypervisor or another architecture.
#
# The one cost is that the tools are installed per run, which is why the two Go jobs restore
# `~/go/bin` from the cache: five linters compiled from source is minutes, not seconds.
name: ci

# Two pushes in a row: the older run is answering a question nobody is asking any more. The
# group is per ref and event, so a pull request is never cancelled by another branch, and a
# manual dispatch never cancels the push it was dispatched to investigate.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Branches only: a pull request is tested on its branch, and a rebase-merge
# keeps that tree, so testing main again after merge repeats the same run.
# Tags skip too: the release job ships artifacts, it needs no second suite.
# A direct push to main is the one gap, and nobody works that way.
on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "v*"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the microVM suite (default: ubuntu-26.04, which has /dev/kvm)"
        required: false
        default: ubuntu-26.04
        type: string

jobs:
  static:
    # The compiler's half: formatting, vet, the layer table, the cross-platform build, and the
    # analysis (complexity, duplication, dead code, error shape). The only test here is the
    # architecture one, so a failure is a rule rather than a behaviour.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The only job that installs the linters: it is the only one that runs them.
      - uses: ./.github/actions/setup
        with:
          tools: true
      - run: make lint

  go:
    # The Go suite, run **once**: COVER=1 instruments the same pass, so the test verdict and the
    # coverage floors come out of one run instead of two. This is the long pole.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make test-suite COVER=1

  worker:
    # The harness suite and the interface's unit tests: seconds each, and they need the bundle
    # built. The Go unit tests are not here — they are in the `go` job's single instrumented run,
    # and running them twice was most of what made this pipeline slow.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: make js-test

  browser:
    # The behaviours a curl cannot see, against a real gateway and a real browser. The gateway is
    # started by the check itself on the host engine: a runner has no hypervisor for the engine
    # tiers, and this suite is about the console rather than the sandbox.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check the browser
        # The image ships Google Chrome; Ubuntu's chromium package is a snap, and on a runner it
        # intermittently misses puppeteer's thirty-second window to print its endpoint — three of
        # five runs on 2026-10-28 failed there with nothing changed in the code under test. Chrome
        # is already here, so the suite runs in it rather than installing a browser that may not
        # start under confinement.
        run: |
          command -v google-chrome
          google-chrome --version
      - run: make ui-check
        env:
          CHROME_PATH: /usr/bin/google-chrome

  verify:
    # The name branch protection requires. It runs nothing itself: it is the fan-in, so a job added
    # to this file cannot be forgotten by the protection rule, and a failed job makes this fail
    # because `needs` is a dependency and not a notification.
    #
    # Every job in this file is a `needs`, including the two engine tiers: they boot real
    # sandboxes, they are the only proof that an engine change works, and until 2026-10-29 they
    # ran on every push without being able to stop a merge — a green `verify` over a red
    # `sandbox` is the gate saying the thing it was asked not to.
    if: always()
    needs: [static, go, worker, browser, commits, floors, mutation-targets, mutations, sandbox, bwrap]
    runs-on: ubuntu-26.04
    steps:
      - name: Every job has to have passed
        env:
          STATIC: ${{ needs.static.result }}
          GO: ${{ needs.go.result }}
          WORKER: ${{ needs.worker.result }}
          BROWSER: ${{ needs.browser.result }}
          COMMITS: ${{ needs.commits.result }}
          FLOORS: ${{ needs.floors.result }}
          TARGETS: ${{ needs.mutation-targets.outputs.packages }}
          MUTATIONS: ${{ needs.mutations.result }}
          SANDBOX: ${{ needs.sandbox.result }}
          BWRAP: ${{ needs.bwrap.result }}
        run: |
          echo "static=$STATIC go=$GO worker=$WORKER browser=$BROWSER commits=$COMMITS"
          echo "floors=$FLOORS mutations=$MUTATIONS targets=$TARGETS sandbox=$SANDBOX bwrap=$BWRAP"
          # A diff that touches no floored package leaves the matrix empty and the sweep
          # skipped. That is a pass: there was nothing to sweep.
          if [ "$MUTATIONS" = "skipped" ] && [ "$TARGETS" = "[]" ]; then
            echo "mutations: nothing to sweep"
            MUTATIONS=success
          fi
          for result in "$STATIC" "$GO" "$WORKER" "$BROWSER" "$COMMITS" \
                        "$FLOORS" "$MUTATIONS" "$SANDBOX" "$BWRAP"; do
            [ "$result" = "success" ] || exit 1
          done

  commits:
    # The commit format is a standard (`.pi/skills/conventional-commits`), so it is checked
    # rather than trusted — over the commits a push adds, not all of history.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The range needs the commits behind it.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Decide what to check
        id: range
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "value=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify -q origin/main >/dev/null; then
            # A rebase rewrites the pushed-away commit, so `before` is gone from history;
            # check what the branch adds on its base instead.
            echo "value=origin/main..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the messages
        if: steps.range.outputs.value != ''
        run: bun scripts/check-commits.mjs "${{ steps.range.outputs.value }}"
      - name: Nothing to check
        if: steps.range.outputs.value == ''
        run: echo "the first push to a branch has no range behind it; skipping"

  floors:
    # The ratchet, checked rather than promised. `docs/engineering/standards.md` S10 says coverage
    # and mutation floors may only move up, and the file they live in is edited by the same pull
    # request that would want to lower it — so this compares the tree with the base branch and
    # fails on a step down. It is deliberately its own job: a lowered floor is not a test failure
    # and should not read as one.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The floors it compares against are on the base branch.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fetch the base branch
        # checkout's own fetch is a promise about the ref this run was started from; the floors
        # it compares against are on `main`, and a missing ref here would be a guard that fails
        # for a reason that has nothing to do with the change.
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - run: make floors

  mutation-targets:
    # Mutation testing on the packages a change touches. It was the weekly report and nothing
    # else, so a pull request that deleted an assertion was green until Monday and then filed an
    # issue. Now the diff decides which packages are swept, `--max` bounds the cost at two of
    # them, and a survivor fails the run: an assertion that stopped distinguishing is exactly the
    # standard going down quietly.
    #
    # The list is its own job because a matrix has to be known before the sweep starts. One job
    # per package, each on its own runner, pays the slowest package instead of the sum: the
    # sandbox's 5m47s plus youki's 2m12s became 5m47s.
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.targets.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Fetch the base branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Decide what to sweep
        id: targets
        run: |
          list=$(bun scripts/mutation-targets.mjs --base origin/main --max 2)
          packages=$(printf '%s\n' "$list" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "sweeping: ${list:-nothing}"

  mutations:
    # One job per package. The loop this replaces paid the sum of the sweeps; the matrix pays
    # the slowest, because each package gets its own runner. `--max 2` still bounds the cost.
    #
    # The timeout coefficient is gremlins' per-mutant allowance multiplied by the coverage run's
    # wall time, and a mutant that spins costs all of it. At the default 500 one identity mutant
    # held this job for an hour; 100 caps that at a couple of minutes and still leaves 30x headroom
    # over the coverage run (workspace note MUTATIONS-SLOWDOWN.md, §4).
    needs: mutation-targets
    if: needs.mutation-targets.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.mutation-targets.outputs.packages) }}
    name: mutations (${{ matrix.package }})
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: true
      - name: Fetch the base branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Mutate the package
        env:
          MUTATION_TIMEOUT: "100"
        run: make mutations PKG="${{ matrix.package }}"

  sandbox:
    # `make test-sandbox` boots real microVMs. A hosted runner has /dev/kvm owned by root:kvm at
    # mode 0660, so the runner user cannot open it until the udev rule below runs; with it, the
    # tier passes on the same machine as the fast jobs. The rule is skipped where it cannot work
    # (no udev, no sudo for it) rather than failed, and the tier itself still fails rather than
    # skips when /dev/kvm is missing or unreadable — a slow tier that silently does nothing is
    # how this bug class survives.
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install bubblewrap for the nested microVM
        # The sandbox tier's own tests need the hypervisor. The nested test also boots a
        # microVM inside a bwrap sandbox, so this job gets the second engine too; without it
        # the test would skip and the tier would still be green.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Make /dev/kvm readable
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Let bubblewrap make user namespaces
        # Ubuntu 24.04 and later gate unprivileged user namespaces behind AppArmor. The nested test
        # and the bwrap lifecycle test both need one; without this they fail before reaching
        # any acornd code. The bwrap job already does this for its own tier.
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all -- /bin/true && echo "bubblewrap can make a user namespace"
      - run: make test-sandbox


  bwrap:
    # The third engine's tier: real bubblewrap, real pasta, a real image pulled from a registry.
    # The fast tier covers the driver and the client against fakes; this is the one job that runs
    # the thing itself.
    #
    # It runs on a hosted runner because it needs three packages installed, and the self-hosted
    # runner has neither sudo nor root — the tier would fail on the box that is meant to run it.
    # Ubuntu 24.04 and later gate unprivileged user namespaces behind AppArmor, so it gets the
    # switch Ubuntu documents for bubblewrap; without it the engine is unusable there for a
    # reason that has nothing to do with this code.
    #
    # The image is 26.04, and the host steps below are why this tier is the one that says what a
    # machine must grant. The profile step is new on that release and was found by this job going
    # red: `passt` now ships `/etc/apparmor.d/usr.bin.pasta`, whose only execute rule is
    # `/{usr/,}bin/** Ux`, so pasta — the process that starts the sandbox's first one — may not run
    # a binary outside those two directories. acornd's supervisor is not one of them. The failure is
    # pasta's own sentence, and dmesg names the profile and the path:
    #
    #   Failed to start command or shell: Permission denied
    #   apparmor="DENIED" operation="exec" class="file" profile="pasta"
    #   name="/tmp/pasta-x/probe" requested_mask="x" denied_mask="x"
    #
    # `/bin/true` through the same pasta command exits 0, which is what says the profile is the
    # cause rather than the namespace, the device, or the binary's permissions. Everything else
    # on that image is fine: bubblewrap is 0.11.1, the userns switch applies, and the worker's
    # own bwrap suite passes 61/61.
    #
    # The profile step is also the regression test for both halves of issue 26: the probe must see
    # the profile before setup's plan turns it off, and must not see it after. A probe that ran
    # `/bin/true` would pass here and then fail in every real sandbox.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install what the engine needs
        # bubblewrap for the sandbox and pasta for its network: the namespace's address and
        # routes are set by the gateway over netlink, so iproute2 is not on this list.
        # pasta does not do itself.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap passt
      - name: Build the binary the sandbox hands pasta
        # The probe runs this binary, not /bin/true, so it has to be one that is not under
        # /usr/bin — which is the same place a real install puts it. This is what makes the check
        # below able to see the profile at all.
        run: |
          cd gateway && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/acornd" ./cmd/acornd
      - name: Let bubblewrap make user namespaces
        # Ubuntu 24.04 and later gate unprivileged user namespaces behind AppArmor. A per-binary profile is
        # enough for bubblewrap on its own, and *not* enough for the sandbox this tier runs: the
        # sandbox's user namespace nests inside the one pasta makes, and the second one is refused
        # ("Couldn't write to /proc/self/uid_map"). The switch is the documented host-wide answer,
        # and on a runner that is only running this tier it is the right one.
        #
        # It comes before the profile step because disabling pasta's profile makes pasta
        # unconfined, and an unconfined process cannot make a user namespace on a machine that still
        # restricts them: the switch and the profile go together, in that order.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-all -- /bin/true && echo "bubblewrap can make a user namespace"
      - name: Let pasta run the supervisor it is given
        # The profile is the distribution's default, not acornd's, and it is unloaded by the plan
        # `acornd setup` applies on a machine that runs acornd for real: the symlink is what a
        # reboot reads, and the parser is what takes the loaded profile away now. The probe is
        # asked before and after, because that is the thing issue 26 was actually about.
        run: |
          profile=/etc/apparmor.d/usr.bin.pasta
          data=$RUNNER_TEMP/acornd-setup
          if [ ! -f "$profile" ]; then
            echo "this image ships no pasta profile; nothing for the step to turn off"
            exit 0
          fi
          before=$("$RUNNER_TEMP/acornd" setup --probe --data-dir "$data")
          if ! printf '%s\n' "$before" | grep -q pastaProblem; then
            echo "::error::the probe says the sandbox network works while pasta's profile refuses a binary outside /usr/bin — the answer /bin/true cannot give: $before"
            exit 1
          fi
          printf '{"pastaProfile":true}\n' > "$RUNNER_TEMP/plan.json"
          sudo "$RUNNER_TEMP/acornd" setup --privileged --plan "$RUNNER_TEMP/plan.json"
          after=$("$RUNNER_TEMP/acornd" setup --probe --data-dir "$data")
          if printf '%s\n' "$after" | grep -q pastaProblem; then
            echo "::error::the probe still refuses pasta after setup's plan turned the profile off: $after"
            sudo grep -i pasta /sys/kernel/security/apparmor/profiles || true
            ls -l /etc/apparmor.d/disable/ || true
            exit 1
          fi
      - run: make test-bwrap
