<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Acornfall</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b8fd9'/%3E%3Cpath d='M16 7c3 4 3 8 0 12-3-4-3-8 0-12z' fill='white'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="/style.css" />
		<script>
			// Panel geometry is read before the first paint, otherwise a saved width
			// arrives after the layout has already been drawn once.
			(function () {
				try {
					var rail = localStorage.getItem("acornfall.rail");
					var inspector = localStorage.getItem("acornfall.inspector");
					var root = document.documentElement;
					if (rail) root.style.setProperty("--rail-w", rail + "px");
					if (inspector) root.style.setProperty("--inspector-w", inspector + "px");
				} catch (error) {
					/* a private window with no storage is not a failure */
				}
			})();
		</script>
	</head>
	<body>
		<header class="topbar">
			<div class="brand">
				<span class="mark"></span>
				<div>
					<div class="title">Acornfall</div>
					<div class="subtle" id="workspace">connecting…</div>
				</div>
			</div>
			<div class="topbar-actions">
				<label class="field">
					<span class="label">Agent</span>
					<select id="agent"></select>
				</label>
				<label class="field">
					<span class="label">Model</span>
					<select id="model"></select>
				</label>
				<label class="field">
					<span class="label">Thinking</span>
					<select id="thinking"></select>
				</label>
				<span class="pill" id="status">connecting</span>
				<button class="ghost" id="connect" type="button">Settings</button>
				<button class="ghost" id="toggle-inspector" type="button">Inspector</button>
			</div>
		</header>

		<main id="main">
			<nav class="rail">
				<button class="primary full" id="new-conversation" type="button">New conversation</button>
				<div class="rail-list" id="conversation-list"></div>
			</nav>
			<div class="splitter" id="split-rail" role="separator" aria-label="Resize conversations panel"></div>

			<section class="conversation">
				<div class="transcript" id="transcript"></div>
				<form class="composer" id="composer">
					<textarea
						id="input"
						rows="1"
						placeholder="Ask, or tell it what to do. Enter sends, Shift+Enter adds a line."
					></textarea>
					<div class="composer-row">
						<div class="composer-modes">
							<label class="mode">
								<input type="checkbox" id="steer" checked />
								<span>Steer into the running turn</span>
							</label>
							<label class="mode">
								<input type="checkbox" id="formatted" checked />
								<span>Formatted replies</span>
							</label>
						</div>
						<div class="composer-buttons">
							<button class="ghost" id="abort" type="button" hidden>Abort</button>
							<button class="primary" id="send" type="submit">Send</button>
						</div>
					</div>
				</form>
			</section>

			<div class="splitter" id="split-inspector" role="separator" aria-label="Resize inspector panel"></div>
			<aside class="inspector" id="inspector"></aside>
		</main>

		<div class="sheet-backdrop" id="sheet" hidden>
			<section class="sheet">
				<header class="sheet-head">
					<div class="sheet-tabs">
						<button class="tab" data-view="providers" type="button">Providers</button>
						<button class="tab" data-view="defaults" type="button">Defaults</button>
					</div>
					<button class="ghost" id="sheet-close" type="button">Close</button>
				</header>
				<div class="sheet-body" id="sheet-body"></div>
			</section>
		</div>

		<script type="module" src="/app.js"></script>
	</body>
</html>
