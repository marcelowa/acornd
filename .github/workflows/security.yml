# The checks nobody runs by hand: a dependency with a published vulnerability, a secret in the
# tree, and the security rules a staticcheck pass does not carry.
#
# None of it is in `make lint`: every one of these needs a network for its database, and lint has
# to work on a train. The Go half runs locally as `make security`, so a finding can be reproduced
# without waiting for a runner.
#
# On the weekly schedule a red run is a report — it says a dependency has a CVE and blocks
# nothing. On a release tag it is a gate, because adopting a vulnerable dependency is worse than a
# failing pipeline at exactly that moment.
#
# The mutation job is the exception: it is a report on the same schedule, and its red run means a
# test stopped proving something rather than that a dependency moved.
name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  vulnerabilities:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: govulncheck
        # Reachable only: the call graph decides, so a CVE in a dependency this build never calls
        # does not hold a release. It found eleven reachable standard-library vulnerabilities on
        # `go 1.27.1`, all fixed by 1.27.2 and 1.27.3 — which is why the module pins 1.27.3.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd gateway && govulncheck ./...

  sast:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: gosec
        # A report, not a gate. This is a sandbox orchestrator: it opens paths and runs processes
        # named by configuration on purpose, so G304 and G204 fire on the architecture rather than
        # on a defect, and the rules that matter there are held by the sandbox's own tests. What
        # gosec still earns is the file-permission and cryptography checks nobody writes by hand.
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd gateway && gosec -quiet ./...

  secrets:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          # The history, not just the diff: a key that was committed once and deleted is still in
          # every clone, and a secret that is only clean in HEAD is not clean.
          fetch-depth: 0
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          gitleaks detect --no-banner --redact

  mutations:
    # The mutation floors are the honest half of "a test that fails without the change", and they
    # cost minutes per package — which is exactly why they are here and not on a pull request.
    #
    # A red run files an issue rather than opening a pull request: a workflow can say which line
    # survived, and nothing more. Writing the test that kills it needs judgement, and a fix PR made
    # without it would be a guess with a green tick on it. The issue carries the report, so the fix
    # is a five-minute job with the evidence already in hand.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        package: ["./internal/control", "./internal/sandbox"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: mutations ${{ matrix.package }}
        id: mutants
        run: |
          set +e
          make mutations PKG=${{ matrix.package }} > "$RUNNER_TEMP/mutants.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mutants.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # The report a person needs, written where the issue step can read it.
          {
            echo "make mutations PKG=${{ matrix.package }} failed on \`${{ github.sha }}\`."
            echo
            echo '```'
            grep -E 'LIVED|Killed:|Test efficacy' "$RUNNER_TEMP/mutants.log" | sed 's/^ *//' | head -40
            echo '```'
            echo
            echo "A surviving mutant is a test that ran and did not distinguish, and the floor in"
            echo "\`.mutationfloors\` may only move up — so the fix is a test, not a number."
          } > "$RUNNER_TEMP/body.md"
          [ "$status" -eq 0 ] || exit 1
      - name: File what survived
        if: failure() || steps.mutants.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: |
          gh label create mutation --description "A mutant lived: a test that ran and did not distinguish" --color "fbca04" 2>/dev/null || true
          title="Mutation survivors in ${PACKAGE#./}"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" --label mutation
          fi
