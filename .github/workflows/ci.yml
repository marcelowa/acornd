# The rules are only real if something checks them on every change.
#
# `make lint` is static analysis and `make test` adds the unit tests, the worker protocol
# against a real worker process, -race, and the end-to-end suite against a real gateway.
# Nothing here needs a model or a network.
name: ci

on:
  push:
  pull_request:
  # The slow tier needs a hypervisor, which GitHub-hosted runners do not have, so it is run
  # on demand and names the runner: a self-hosted label with /dev/kvm. The default path must
  # never depend on it (see the sandbox job below).
  workflow_dispatch:
    inputs:
      runner:
        description: "A runner with /dev/kvm (a self-hosted label, or a larger runner with nested virtualisation)"
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The end-to-end suite skips itself without bun and the worker's dependencies, so a
      # missing install would look like a pass.
      - run: make deps
      - run: make tools
      - run: make test

  commits:
    # The commit format is a standard (`.pi/skills/conventional-commits`), so it is checked
    # rather than trusted — over the commits a pull request or a push adds, not all of history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The range needs the commits behind it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Decide what to check
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ github.event.pull_request.base.sha }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "value=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the messages
        if: steps.range.outputs.value != ''
        run: node scripts/check-commits.mjs "${{ steps.range.outputs.value }}"
      - name: Nothing to check
        if: steps.range.outputs.value == ''
        run: echo "the first push to a branch has no range behind it; skipping"

  sandbox:
    # `make test-sandbox` boots real microVMs, so it runs only where somebody dispatched it to
    # a hypervisor. It fails rather than skips when /dev/kvm is missing, because a slow tier
    # that silently does nothing is how this bug class survives.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: make deps
      - run: make test-sandbox

