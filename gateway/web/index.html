<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Acornfall</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b8fd9'/%3E%3Cpath d='M16 7c3 4 3 8 0 12-3-4-3-8 0-12z' fill='white'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<header class="topbar">
			<div class="brand">
				<span class="mark"></span>
				<div>
					<div class="title">Acornfall</div>
					<div class="subtle" id="workspace">connecting…</div>
				</div>
			</div>
			<div class="topbar-actions">
				<label class="field">
					<span class="label">Agent</span>
					<select id="agent"></select>
				</label>
				<label class="field">
					<span class="label">Model</span>
					<select id="model"></select>
				</label>
				<span class="pill" id="status">connecting</span>
				<button class="ghost" id="connect" type="button">Providers</button>
				<button class="ghost" id="toggle-inspector" type="button">Inspector</button>
			</div>
		</header>

		<main>
			<section class="conversation">
				<div class="transcript" id="transcript"></div>
				<form class="composer" id="composer">
					<textarea
						id="input"
						rows="1"
						placeholder="Ask, or tell it what to do. Enter sends, Shift+Enter adds a line."
					></textarea>
					<div class="composer-row">
						<label class="mode">
							<input type="checkbox" id="steer" checked />
							<span>Steer into the running turn</span>
						</label>
						<div class="composer-buttons">
							<button class="ghost" id="abort" type="button" hidden>Abort</button>
							<button class="primary" id="send" type="submit">Send</button>
						</div>
					</div>
				</form>
			</section>

			<aside class="inspector" id="inspector">
				<div class="card">
					<h2>
						Agent
						<button class="ghost small" id="reload-agents" type="button">Reload files</button>
					</h2>
					<dl id="agent-facts"></dl>
					<div id="agent-layers"></div>
				</div>
				<div class="card">
					<h2>Context sent</h2>
					<div id="context"></div>
				</div>
				<div class="card">
					<h2>Run</h2>
					<dl id="run-facts"></dl>
				</div>
				<div class="card">
					<h2>Usage</h2>
					<pre id="usage">—</pre>
				</div>
				<div class="card">
					<h2>View</h2>
					<pre id="raw">—</pre>
				</div>
			</aside>
		</main>

		<script type="module" src="/app.js"></script>

		<div class="sheet-backdrop" id="sheet" hidden>
			<section class="sheet">
				<header class="sheet-head">
					<h1 id="sheet-title">Connect a provider</h1>
					<button class="ghost" id="sheet-close" type="button">Close</button>
				</header>
				<div class="sheet-body" id="sheet-body"></div>
			</section>
		</div>
	</body>
</html>
