# The rules are only real if something checks them on every change.
#
# `make lint` is static analysis and `make test` adds the unit tests, the worker protocol
# against a real worker process, -race, and the end-to-end suite against a real gateway.
# `make test-sandbox` boots real microVMs, and GitHub-hosted Linux runners do expose
# /dev/kvm — it is just 660 root:kvm, so the job makes it readable first. The dispatch input
# is for running the microVM suite somewhere else (a self-hosted label, or an ARM image that
# has KVM).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the microVM suite (default: ubuntu-latest, which has /dev/kvm)"
        required: false
        default: ubuntu-latest
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The end-to-end suite skips itself without bun and the worker's dependencies, so a
      # missing install would look like a pass.
      - run: make deps
      - run: make tools
      - run: make test

  commits:
    # The commit format is a standard (`.pi/skills/conventional-commits`), so it is checked
    # rather than trusted — over the commits a pull request or a push adds, not all of history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The range needs the commits behind it.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Decide what to check
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ github.event.pull_request.base.sha }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "value=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify -q origin/main >/dev/null; then
            # A rebase rewrites the pushed-away commit, so `before` is gone from history;
            # check what the branch adds on its base instead.
            echo "value=origin/main..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the messages
        if: steps.range.outputs.value != ''
        run: bun scripts/check-commits.mjs "${{ steps.range.outputs.value }}"
      - name: Nothing to check
        if: steps.range.outputs.value == ''
        run: echo "the first push to a branch has no range behind it; skipping"

  sandbox:
    # `make test-sandbox` boots real microVMs. GitHub's Linux runners have /dev/kvm; the udev
    # rule gives the runner user access to it. It fails rather than skips when /dev/kvm is
    # missing or unreadable, because a slow tier that silently does nothing is how this bug
    # class survives.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Make /dev/kvm readable
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: make deps
      - run: make test-sandbox

