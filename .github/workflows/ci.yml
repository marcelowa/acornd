# The rules are only real if something checks them on every change.
#
# `make lint` is static analysis and `make test` adds the unit tests, the worker protocol
# against a real worker process, -race, and the end-to-end suite against a real gateway.
# `make test-sandbox` boots real microVMs, which need /dev/kvm. Every job here runs on the
# self-hosted runner: one Linux container with the hypervisor passed through, and with the
# toolchains installed once instead of once per job. The label sets are what the job needs,
# not a machine name, so a second runner can join without an edit here. The dispatch input is
# the way to send the microVM suite somewhere else — a runner with another hypervisor, or an
# ARM image that has KVM — and its default is this runner's own label, so that a plain
# dispatch lands where the rest of the CI does.
name: ci

# Branches only: a pull request is tested on its branch, and a rebase-merge
# keeps that tree, so testing main again after merge repeats the same run.
# Tags skip too: the release job ships artifacts, it needs no second suite.
# A direct push to main is the one gap, and nobody works that way.
on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "v*"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the microVM suite (default: the self-hosted runner, which has /dev/kvm)"
        required: false
        default: kvm
        type: string

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The end-to-end suite skips itself without bun and the worker's dependencies, so a
      # missing install would look like a pass.
      - run: make deps
      - run: make tools
      - run: make test

  commits:
    # The commit format is a standard (`.pi/skills/conventional-commits`), so it is checked
    # rather than trusted — over the commits a push adds, not all of history.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          # The range needs the commits behind it.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Decide what to check
        id: range
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "value=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify -q origin/main >/dev/null; then
            # A rebase rewrites the pushed-away commit, so `before` is gone from history;
            # check what the branch adds on its base instead.
            echo "value=origin/main..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the messages
        if: steps.range.outputs.value != ''
        run: bun scripts/check-commits.mjs "${{ steps.range.outputs.value }}"
      - name: Nothing to check
        if: steps.range.outputs.value == ''
        run: echo "the first push to a branch has no range behind it; skipping"

  sandbox:
    # `make test-sandbox` boots real microVMs. The runner passes /dev/kvm through, owned by
    # root:kvm at mode 0660, and the runner user is in the `kvm` group that owns it. A
    # GitHub-hosted runner has the same device and needs the udev rule below to reach it; the
    # rule is skipped where it cannot work (no udev, no sudo for it) rather than failed. The
    # tier itself still fails rather than skips when /dev/kvm is missing or unreadable,
    # because a slow tier that silently does nothing is how this bug class survives.
    runs-on: ${{ inputs.runner || 'kvm' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Make /dev/kvm readable
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: make deps
      - run: make test-sandbox


  bwrap:
    # The third engine's tier: real bubblewrap, real pasta, a real image pulled from a registry.
    # The fast tier covers the driver and the client against fakes; this is the one job that runs
    # the thing itself, so it installs what the engine needs and then lets the tier assert it
    # (ACORNFALL_BWRAP_ONLY makes a missing piece a failure rather than a skip).
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: gateway/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install what the engine needs
        # bubblewrap for the sandbox, pasta for its network, and iproute2 for the address step
        # pasta does not do itself. A runner that cannot install them fails here, loudly.
        #
        # `sudo` is not on every runner — a container-based runner is already root, and one
        # without sudo at all is a runner that cannot run this tier. Both are said plainly.
        run: |
          for tool in bwrap pasta ip; do
            command -v "$tool" >/dev/null || missing=1
          done
          if [ -z "${missing:-}" ]; then echo "bubblewrap, pasta, and ip are already here"; exit 0; fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else
            command -v sudo >/dev/null || { echo "::error::this runner has no sudo and is not root, so the engine's packages cannot be installed"; exit 1; }
            SUDO=sudo
          fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq bubblewrap passt iproute2
      - run: make deps
      - run: make test-bwrap
